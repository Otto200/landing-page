<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankBugs|FX</title>

       <!-- Favicon Link -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <!-- Universal High Readability Google Fonts Link -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Link your dedicated splash stylesheet -->
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>

    <main class="splash-wrapper">
        
            <!-- App Icon Wrapper for logo.webp -->
            <div class="app-icon-container">

            <h1 class="brand-title">BankBugs<span class="brand-accent">|FX</span></h1>

        <!-- Terminal Status Dynamic Engine -->
        <div class="terminal-loading-block">

                <div class="loading-bar-progress" id="progress-bar"></div>
            </div>
            <div class="status-terminal-log" id="status-terminal">INITIALIZING SECURE GATEWAY...</div>
        </div>

    <!-- Link your splash interaction script -->
